<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MohaLaChips Twitch Clips Overlay V2</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; font-family:Arial,Helvetica,sans-serif; }
    #player { position:fixed; inset:0; width:100%; height:100%; border:0; background:#000; }
    #controls {
      position:fixed; top:18px; right:18px; z-index:20;
      display:flex; gap:8px; opacity:0; transition:opacity .2s ease;
    }
    body:hover #controls, #controls:focus-within { opacity:1; }
    button {
      border:1px solid rgba(255,255,255,.25);
      border-radius:12px; padding:11px 15px;
      background:rgba(8,8,12,.78); color:#fff;
      font-size:14px; font-weight:700; cursor:pointer;
      backdrop-filter:blur(10px);
    }
    button:hover { background:rgba(35,35,45,.92); }
    #badge {
      position:fixed; left:18px; top:18px; z-index:20;
      padding:8px 12px; border-radius:10px;
      background:rgba(8,8,12,.65); color:#fff;
      font-size:12px; font-weight:700; letter-spacing:.08em;
      opacity:0; transition:opacity .2s ease; pointer-events:none;
    }
    body:hover #badge { opacity:.75; }
  </style>
</head>
<body>
  <iframe id="player" allow="autoplay; fullscreen" allowfullscreen></iframe>

  <div id="badge"></div>

  <div id="controls">
    <button id="reroll">↻ REROLL 100 CLIPS</button>
  </div>

  <script>
    (() => {
      'use strict';

      const qs = new URLSearchParams(location.search);
      const channel = (qs.get('channel') || 'mohalachips').replace(/^@/, '').trim();
      const limit = Math.min(100, Math.max(1, Number(qs.get('count') || 100)));
      const player = document.getElementById('player');
      const badge = document.getElementById('badge');
      const reroll = document.getElementById('reroll');

      badge.textContent = `${channel.toUpperCase()} • ${limit} CLIPS`;

      function buildPlayerUrl() {
        const p = new URLSearchParams({
          channel,
          exclude: '',
          limit: String(limit),
          dateRange: '0',
          videoSize: '1920x1080',
          themeOption: '0',
          preferFeatured: 'false',
          showText: 'false',
          progressBar: 'true',
          profileBadge: 'false',
          showDetails: 'false',
          detailsText: '',
          mainAccount: channel,
          command: '',
          customText: '',
          showFollowing: 'false',
          delay: '0',
          cache: 'false',
          ref: '',
          clientId: '',
          _reroll: String(Date.now())
        });

        return `https://twitchclipsplayer.com/clips.html?${p.toString()}`;
      }

      function rerollClips() {
        player.src = 'about:blank';
        setTimeout(() => {
          player.src = buildPlayerUrl();
        }, 120);
      }

      reroll.addEventListener('click', rerollClips);

      window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r') rerollClips();
      });

      rerollClips();
    })();
  </script>
</body>
</html>
